# rev4-admin dev override
#
# 用法（配合 base）:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# 特性:
#   - 全部 host port 綁 127.0.0.1 loopback（配號＝ADR 0019）
#   - front-nginx：HTTP :42080 + HTTPS :42443（dev-certs bind-mount + dev.conf）
#   - base-web：node 裸映像 vite 熱重載（bind-mount source + named volume mask）
#   - rust-api：watchexec dev target（bind-mount source + cargo registry／target 卷 mask）
#   - postgres/redis：直連 debug port

services:
  front-nginx:
    ports:
      - "127.0.0.1:42080:80"
      - "127.0.0.1:42443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/_locations.inc:/etc/nginx/conf.d/_locations.inc:ro
      # dev.conf 掛成 default.conf：覆蓋映像內建 default server、conf.d glob 只載本檔
      - ./deploy/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      # ★ 只掛 nginx 消費的兩支檔——整掛 dev-certs/ 會把 root CA 私鑰（ca.key、
      #   且依 trust 教學已進 OS 信任庫）暴露進最外層容器
      - ./deploy/dev-certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./deploy/dev-certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    # healthcheck 零覆寫：容器內 listen 80 與 base 層探針同號（dev/prod 通用紅利）

  base-web:
    image: node:26.4.0-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      BROWSER: none
      # CI=true → pnpm install 預設 frozen-lockfile（保 base-web 零 fork 改動不變式：
      # 容器內 install 不許動 pnpm-lock.yaml）
      CI: "true"
      npm_config_store_dir: /pnpm-store
      # WSL2 9p bind mount 不產生 fs 事件——vite 熱更新必須輪詢（同後端 watchexec
      # --poll 1s 紀律）；vite 內建 chokidar 的 env 覆寫直達 watcher、免動 fork 內設定檔
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./base-web:/app
      - base_web_node_modules:/app/node_modules
      - base_web_pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:42081:80"
    command:
      - sh
      - -c
      - "npm install -g pnpm@10.34.3 && pnpm install && pnpm dev --host 0.0.0.0 --port 80"
    healthcheck:
      # 127.0.0.1 而非 localhost：vite --host 0.0.0.0 只綁 IPv4、alpine localhost 先解 ::1
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ | grep -qi '<!doctype\\|<html'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    tty: true
    stdin_open: true

  rust-api:
    build:
      target: dev
    image: rev4-admin-rust-api:dev
    environment:
      # B-081 dev 尾巴：xdb 資料檔經 ./rust-api bind-mount 已在容器內 /app/xdb/resources/；
      # 指 XDB_FILEPATH 過去使 boot Path::exists 命中→xdb_ready=true（否則預設相對路徑
      # resources/ip2region.xdb 對不上實際位置、dev region 解析恆降級、稽核 region 恆空）。
      # prod 映像 COPY＋路徑設定仍屬部署刀（B-081 主體、L-084 四處 COPY）。
      XDB_FILEPATH: /app/xdb/resources/ip2region.xdb
    # watcher 不宜當 PID 1：tini 接管訊號轉發
    init: true
    volumes:
      - ./rust-api:/app
      # ★ 只掛 registry 子目錄——整掛 /usr/local/cargo 會蓋掉 bin/（cargo、watchexec 執行檔）
      - rust_api_cargo_cache:/usr/local/cargo/registry
      - rust_api_target:/app/target
    ports:
      - "127.0.0.1:42079:8080"
    healthcheck:
      # dev 映像無 curl/wget → bash TCP 探針；120s start_period＝cargo 冷編實測磨合值
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  migrate:
    build:
      target: dev
    image: rev4-admin-rust-api:dev
    volumes:
      # 與 rust-api 共 mask 卷無並行問題：depends_on 序保證 migrate 跑完 rust-api 才起
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo/registry
      - rust_api_target:/app/target
    # ★ entrypoint 必須整段 override：dev 映像 ENTRYPOINT＝watchexec（跑 server），
    #   只改 command 會被當 watcher 參數
    entrypoint: ["cargo", "run", "--bin", "migration"]
    command: ["up"]

  postgres:
    ports:
      - "127.0.0.1:45432:5432"

  redis:
    ports:
      - "127.0.0.1:46379:6379"

  # ═══ 016-observability T009 dev override（host port 綁 127.0.0.1、配號＝ADR 0019；config
  #     bind-mount 沿 rev3 姿態住 dev 層）═══
  #   networks／profiles／mem_limit 繼承 base（不重列）；alloy／socket-proxy／兩 exporter
  #   零 host port（FR-008 僅四件配號）。
  loki:
    ports:
      - "127.0.0.1:43100:3100"
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro

  alloy:
    volumes:
      - ./deploy/alloy/alloy-config.alloy:/etc/alloy/config.alloy:ro

  grafana:
    ports:
      - "127.0.0.1:43000:3000"
    volumes:
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro

  prometheus:
    ports:
      - "127.0.0.1:49090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  pushgateway:
    ports:
      - "127.0.0.1:49091:9091"

  # ═══ 016-observability T025 reaper dev override（比照 migrate：target＋共用 mask 卷＋
  #     entrypoint 整段 override——dev 映像 ENTRYPOINT＝watchexec、只改 command 會被當
  #     watcher 參數）═══
  reaper:
    build:
      target: dev
    image: rev4-admin-rust-api:dev
    # sh while-loop 不宜當 PID 1（無 trap 的 shell 忽略 SIGTERM→stop 撐滿 grace 才 SIGKILL）：
    # tini 接管 PID 1 轉發信號、stop 秒退（同 rust-api watcher 姿態）
    init: true
    # dev cargo run 連結峰值需 >768m（base 值、macOS 冷編實測 OOM）——dev 冷編提至 2g
    mem_limit: 2g
    volumes:
      # 與 rust-api／migrate 共 mask 卷：cargo 檔案鎖自然序列化、loop 週期性短跑無長佔
      - ./rust-api:/app
      - rust_api_cargo_cache:/usr/local/cargo/registry
      - rust_api_target:/app/target
    # 姿態分派（contracts/reaper-cli.md；quickstart S5）：
    #   up（sidecar 常駐）→ command=loop → 每 REAPER_INTERVAL_SECS 跑一次★明文帶 --execute
    #     （dry-run 屬手動驗證姿態、杜絕常駐空轉）；bin 跑完即退、while-loop 週期重跑
    #     （transient 失敗不中斷 loop、sleep 後重試——rev3 cleanup-job 母版形）。
    #   docker compose run --rm reaper dry-run → 一次性 dry-run（零變動、推 mode=dry-run 心跳）。
    #   docker compose run --rm reaper --execute → 一次性真刪（run args 蓋 command、* 分支透傳 bin）。
    # ★REAPER_INTERVAL_SECS fallback 86400——與 rules.yml 告警⑤/⑥門檻 172800 互為 2× 錨
    #   （寫死；涵蓋 token-reap 之⑤與 audit-retention 之⑥；調整 MUST 同步改⑤/⑥兩門檻——
    #   三檔同步：本檔＋docker-compose.yml＋rules.yml；契約＝specs/016-observability/contracts/
    #   reaper-cli.md＋specs/017-audit-retention/contracts/alerting-retention.md）。
    # $$ → compose 不 interpolate、留給容器內 sh；$0=reaper-dispatch、$1 起＝command／run args。
    entrypoint:
      - sh
      - -c
      - |
        case "$${1:-}" in
          loop) while true; do cargo run --bin reaper -- --execute; cargo run --bin reaper -- --job audit-retention --execute; sleep "$${REAPER_INTERVAL_SECS:-86400}"; done ;;
          dry-run) exec cargo run --bin reaper ;;
          *) exec cargo run --bin reaper -- "$$@" ;;
        esac
      - reaper-dispatch
    command: ["loop"]

# dev 專用 mask 卷（卷跟著使用它的層走；無顯式 name:、繼承 project 前綴）
volumes:
  base_web_node_modules:
  base_web_pnpm_store:
  rust_api_cargo_cache:
  rust_api_target:
