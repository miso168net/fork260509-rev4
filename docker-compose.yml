# rev4-admin master compose — base 層（六 service 共通定義）
#
# 用法（001 僅 dev override；prod override 歸部署刀）:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# 設計鐵律:
#   - base 層禁 host ports（ports: 為 list append，override 疊加會衝突）
#   - base 層禁 dev 專屬 volume/bind-mount
#   - base-web 故意空殼（無 image/build/command）：dev＝裸 node image、prod＝nginx build，
#     異質、無法靠 target 覆寫 → base 單獨 config 不可 up 屬預期
#   - named volume 不設顯式 name:，靠 project name（rev4-admin）auto-prefix 隔離

name: rev4-admin

services:
  front-nginx:
    image: nginx:1.31.2-alpine
    depends_on:
      base-web:
        condition: service_healthy
      rust-api:
        condition: service_healthy
    healthcheck:
      # 用 127.0.0.1 而非 localhost：alpine /etc/hosts 把 localhost 先解到 ::1（IPv6），
      # nginx listen 80 只綁 IPv4 → localhost 會 connection refused、healthcheck 永遠 fail
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rev4_net

  base-web:
    # ★ image/build/command 故意不放 base 層：dev override（node image、無 build）才給；
    #   prod（nginx multi-stage build）異質，若 base 放 build 會被誤 build 並錯誤 tag。
    networks:
      - rev4_net

  rust-api:
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api
      # base 不給 target：001 Dockerfile 僅 dev stage，target 下放 dev override
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ★ gate 本體：migration 非零退出 → rust-api 不啟動 → up --wait 非零退出
      migrate:
        condition: service_completed_successfully
    environment:
      # jwt／refresh／redis_url 本刀接而不讀（compose 接線就位、消費歸後續功能刀）
      APP_JWT_JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_JWT_REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      APP_DATABASE_URL_FILE: /run/secrets/database_url
      APP_REDIS_URL_FILE: /run/secrets/redis_url
      # 007-login-throttle：captcha challenge HS256 密鑰（第三把秘鑰、與 jwt/refresh 隔離）
      APP_CAPTCHA_SECRET_FILE: /run/secrets/captcha_secret
      # 004-system-settings：JWT iss/aud（非機密→plain env、無需 secret 檔；值對齊 auth/jwt.rs 常數）
      APP_JWT_ISS: rev4-admin
      APP_JWT_AUD: rev4-admin-web
      # ═══ 020-email-verify SMTP 六常設 plain env（非機密、Gmail 形預設；data-model §5——
      #     dev override 覆寫七鍵、prod 部署層以真值覆寫）。★APP_SMTP_USERNAME 與
      #     APP_MAIL_SUBJECT_SUFFIX 於 base 一律不設鍵：不設鍵＝空語意（跳過 AUTH／主旨無後綴）、
      #     設鍵即必非空（config env_or_file 空值 panic 機器強制；R8）═══
      # SMTP 主機（prod＝smtp.gmail.com；dev override 指 dev 收信件服務）
      APP_SMTP_HOST: smtp.gmail.com
      # SMTP 埠（prod＝587 STARTTLS；parse u16 fail-loud）
      APP_SMTP_PORT: "587"
      # STARTTLS 開關（僅 "true"/"false"；true→Tls::Required 不可降級、false 僅 dev 明文）
      APP_SMTP_STARTTLS: "true"
      # 寄件人（★Gmail From 硬約束＝MUST 登入帳號或其已驗證 send-as alias、否則被改寫——research
      # R3；prod 部署層覆寫為 smtp_username 真值；base 佔位走 Gmail 形、非 CHANGE-ME 開頭）
      APP_MAIL_FROM: your-account@gmail.com
      # 寄件顯示名（prod 部署自定）
      APP_MAIL_DISPLAY_NAME: rev4-admin
      # 回信位址（prod 部署自定）
      APP_MAIL_REPLY_TO: your-account@gmail.com
      # 020-email-verify：SMTP 密碼（dev＝亂數 leaf 未消費；prod 真值＝Gmail app password）
      APP_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # 020-email-verify：驗證憑據 HS256 獨立金鑰（與 jwt/refresh/captcha 隔離）
      APP_EMAIL_VERIFY_SECRET_FILE: /run/secrets/email_verify_secret
      RUST_LOG: "info"
    secrets:
      - jwt_secret
      - refresh_token_secret
      - database_url
      - redis_url
      - captcha_secret
      - smtp_password
      - email_verify_secret
    # healthcheck 住 dev override（dev 映像無 curl/wget、以 TCP 探針）
    networks:
      - rev4_net

  migrate:
    # 一次性 migration service（one-shot gate）；dev override 提供 target＋entrypoint/command
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    restart: "no"
    networks:
      - rev4_net

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: soybean
      POSTGRES_DB: soybean_admin_rust
    secrets:
      - postgres_password
    volumes:
      # ★ postgres:18 映像宣告 VOLUME /var/lib/postgresql（PGDATA=/var/lib/postgresql/18/docker
      #   住其下、與 17 佈局不同）——named volume 必須掛父目錄；掛 …/data 會讓資料
      #   漏進匿名卷、down→up 全失（docker image inspect 實查後定此掛點）
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soybean -d soybean_admin_rust"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rev4_net

  redis:
    image: redis:8.8.0-alpine
    command:
      - sh
      - -c
      # $$ → compose 不 interpolate、留給容器內 sh 執行 command substitution。
      # ★ 顯式 --dir /data 必須保留：預設 dir 落容器暫存層 → /data named volume 形同虛設、
      #   down→up 資料全失（前代實機驗收踩過的坑）
      - 'redis-server --dir /data --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rev4_net

  # ═══ 016-observability T009 obs（log 軌、profiles:[obs] opt-in、一般 up 不啟）═══
  # ★ 每個觀測 service MUST networks:[rev4_net]（無 default network、漏接＝service DNS 靜默
  #   不通／prometheus scrape 靜默 down）；socket-proxy 唯一例外＝僅掛 socket_proxy_net
  #   （FR-015：業務網段內容器對 proxy 不可達）。
  # ★ 全件 mem_limit（FR-007；rev3 as-built 未設＝rev4 新增紀律）＋restart: unless-stopped
  #   （S8 觀測件故障自死〔crash／OOM、PID 1 消亡〕後自行回復；★docker kill/stop 屬 Docker
  #   「手動停止」語意、restart policy 明文不套用〔防重啟迴圈〕——手動 kill 之復原路徑＝
  #   compose up -d；S8 實測兩腿分證。rev3 obs 段未設 restart、rev4 依 S8 驗收補上）。
  #   config bind-mount 住 dev override（沿 rev3 姿態）。
  loki:
    profiles: [obs]
    image: grafana/loki:3.7.3
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - loki_data:/loki
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - rev4_net

  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.17.1
    # ★ FR-015 非 root：473＝映像內建 alloy user（docker image inspect 實查：映像預設 USER
    #   為空＝root、故必須顯式指定）；/var/lib/alloy/data 映像內 473:473 mode 770、named
    #   volume 首建繼承 ownership → 非 root 可寫。docker.sock 絕不掛本容器——docker-SD 與
    #   log 採集一律經 socket-proxy tcp 白名單端點（見 deploy/alloy/alloy-config.alloy）。
    user: "473:473"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - alloy_data:/var/lib/alloy/data
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      - loki
      - socket-proxy
    networks:
      - rev4_net
      - socket_proxy_net

  socket-proxy:
    profiles: [obs]
    # wollomatic socket-proxy＝deny-by-default docker.sock 代理（research R3 選型；tecnativa
    # 前綴放行整棵 /containers 子樹、結構上無法滿足 FR-015 遂翻案）。
    # ★ tag 無 v 前綴：上游 GitHub tag 與 Docker Hub tag 一律 1.12.3（R1 表記 v1.12.3 之 v
    #   屬 release 慣稱、registry 實查無此 tag；版本數字逐字同 R1 拍板）。
    image: wollomatic/socket-proxy:1.12.3
    # 65534＝映像預設 user（nobody）；gid＝本機 /var/run/docker.sock 之群組 gid——sock 660、
    #   需掛該 gid 才可讀寫 socket。★gid 隨機器而異（WSL2 docker 群組=1001、macOS Docker
    #   Desktop VM=0；2026-07-19 macOS 實測硬編碼 1001 起檔即 crash loop exit 2）：值改走
    #   repo 根 .env 之 SOCKET_PROXY_GID（實查步驟＝RUNBOOK §4）、預設 1001——錯機起檔照樣
    #   crash loop＝fail-loud 精神保留、僅值的來源本地化（.env gitignored、不逼人改追蹤檔）。
    user: "65534:${SOCKET_PROXY_GID:-1001}"
    command:
      # 白名單＝alloy 實需端點恰好集（R3 原始碼實證：docker-SD 用 containers/json＋networks、
      # inspect 用 containers/{id}/json、採集用 containers/{id}/logs、版本協商用 _ping／version）。
      # ★ 錨定行為源碼實證（1.12.3 internal/config/config.go:597）：regexp.Compile("^"+regex+"$")
      #   ＝自動整串錨定；比對對象＝r.URL.Path（不含 query string）——故 logs?stdout=1 之類
      #   query 不影響匹配。其餘 path 落 deny-by-default（403）、method 不在名單（405）——
      #   archive／export／attach 天然被拒（S7 四負二正實測歸 T027）。
      - '-listenip=0.0.0.0'
      # allowfrom 預設 127.0.0.1/32 必須放寬；hostname 形每請求經 docker DNS 解析、不快取
      # （源碼實證）——僅 alloy 容器 IP 放行、與專用網段雙層防護。
      - '-allowfrom=alloy'
      - '-allowGET=(/v[0-9.]+)?/(_ping|version|networks|containers/json|containers/[A-Za-z0-9_.-]+/(json|logs))'
      - '-allowHEAD=(/v[0-9.]+)?/_ping'
    volumes:
      # :ro 掛載＝防 unlink／重建；unix socket 之 connect/write 不受 ro bind 影響（正常放行）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - socket_proxy_net

  grafana:
    # 跨掛兩 profile：僅 obs（看 log）或僅 metrics（看指標）單獨啟用時 grafana 都在
    profiles: [obs, metrics]
    image: grafana/grafana:13.1.0
    environment:
      # $$__file → compose 不 interpolate、grafana 收到 $__file{...}（file provider 讀 secret；
      # rev3 as-built 慣例照搬）
      GF_SECURITY_ADMIN_PASSWORD: "$$__file{/run/secrets/grafana_admin_password}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
      # 016-observability T012：alerting contact point webhook URL（provisioning yaml 內
      # $__file{/run/secrets/alert_webhook_url} 讀取；URL 不以完整字面進版本庫——★dev 佔位現值
      # 仍可由 deploy/dev-webhook-sink.sh 之 NAME 推導＝dev-only 已接受殘餘、L-190）
      - alert_webhook_url
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      # 僅 metrics profile 啟用時 loki 不在集合內——required:false 容忍缺席（rev3 同形）
      loki:
        condition: service_started
        required: false
    networks:
      - rev4_net

  # ═══ 016-observability T009 metrics（指標軌、profiles:[metrics] opt-in、一般 up 不啟）═══
  prometheus:
    profiles: [metrics]
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # retention 15d 走 command flag（deploy/prometheus/prometheus.yml 標頭已錨定此分工）
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus_data:/prometheus
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - rev4_net

  postgres_exporter:
    profiles: [metrics]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      # DB 名＝soybean_admin_rust（對齊 postgres POSTGRES_DB）；reuse postgres_password、
      # 絕不明文密碼（rev3 as-built 形）。0.20.1 breaking＝replication_slot 系指標改名，
      # 單機 dev 該組資料本為空、面板受影響格歸 T018 grep 處理（R1）。
      DATA_SOURCE_URI: postgres:5432/soybean_admin_rust?sslmode=disable
      DATA_SOURCE_USER: soybean
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - rev4_net

  redis_exporter:
    profiles: [metrics]
    # ★ 必 -alpine 變體（bare＝FROM scratch 無 sh、下方 sh-wrapper 會掛；rev3 hindsight）
    image: oliver006/redis_exporter:v1.87.0-alpine
    environment:
      # rev4 redis 服務名＝redis（rev3 redis-stack 改名點）
      REDIS_ADDR: redis://redis:6379
    entrypoint:
      - sh
      - -c
      # $$ → 留給容器內 sh 做 command substitution（reuse redis_password、絕不明文密碼）
      - 'export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"; exec /redis_exporter'
    secrets:
      - redis_password
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - rev4_net

  pushgateway:
    profiles: [metrics]
    image: prom/pushgateway:v1.11.3
    # FR-008 持久卷＋重啟不失憶（rev3 in-memory 形＝有意識偏離修正）。
    # ★ 掛載點＝/pushgateway（映像 WORKDIR、nobody:nobody 775）——named volume 首建繼承
    #   ownership、映像預設 user 65534 可寫；掛映像不存在的路徑＝docker 以 root 建目錄、
    #   nobody 寫不進 persistence 檔。
    command:
      - --persistence.file=/pushgateway/pushgateway.data
    volumes:
      - pushgateway_data:/pushgateway
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - rev4_net

  # ═══ 016-observability T025 jobs（reaper 回收 sidecar、profiles:[jobs] opt-in、一般 up 不啟）═══
  reaper:
    profiles: [jobs]
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api
      # base 不給 target（沿 migrate 形）；dev override 提供 target＋entrypoint 姿態分派
    environment:
      # ★最小權限連線（FR-013／ADR 0072）：reaper_database_url＝reaper role 憑證（composite
      #   secret；m012 建 role＋GRANT、deploy/setup-reaper-role.sh 設密）——絕不掛 database_url
      #   （soybean 全權身分）。
      APP_DATABASE_URL_FILE: /run/secrets/reaper_database_url
      RUST_LOG: "info"
      # REAPER_GRACE_DAYS 不設＝bin fail-default 7 天（FR-018）；
      # REAPER_INTERVAL_SECS 不設＝dev override loop 內 fallback 86400（每日一輪）——
      # ★與 deploy/grafana-provisioning/alerting/rules.yml 告警⑤/⑥門檻 172800 互為 2× 錨
      #   （172800 = 2 × 86400；涵蓋 token-reap 之⑤與 audit-retention 之⑥）：調 REAPER_INTERVAL_SECS
      #   MUST 同步改⑤/⑥兩門檻——三檔同步：本檔＋docker-compose.dev.yml＋rules.yml
      #   （契約＝specs/016-observability/contracts/reaper-cli.md＋
      #   specs/017-audit-retention/contracts/alerting-retention.md）。
    secrets:
      - reaper_database_url
    depends_on:
      postgres:
        condition: service_healthy
    # ★768m 不足 dev cargo run 連結峰值（2026-07-19 macOS 實測 ld 遭 cgroup OOM 殺 signal 9）
    #   ——dev override 提至 2g；本值供 prod 預編二進位姿態（跑 binary 非編譯）。sidecar 跑
    #   loop 非 server。
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - rev4_net

networks:
  rev4_net:
  # 016-obs FR-015：socket-proxy 專用網段——成員恰為 proxy＋alloy 兩件；internal＝無對外
  # NAT 出口（proxy 只需被 alloy 達、自身只連 docker.sock）
  socket_proxy_net:
    internal: true

volumes:
  postgres_data:
  redis_data:
  # 016-observability obs 卷（profiles:[obs] opt-in、一般 up 不建）
  loki_data:
  alloy_data:
  grafana_data:
  # 016-observability metrics 卷（profiles:[metrics] opt-in、一般 up 不建）
  prometheus_data:
  pushgateway_data:

# 019-secrets-sops T028（FR-018／P5.3）：落點經 SECRETS_DIR 帶預設值變數展開——單一事實
# 來源＝repo 根 .env（gitignored、bootstrap 代勞產生、值必須為絕對路徑字面；.env.example
# 有產檔約束全文）；未設變數回退 ./deploy/secrets（#4 向後相容——忘設＝保護失效，由
# preflight／bootstrap 斷言補償、ADR 誠實登記）。★reaper_password 不進 compose 是設計
# （僅 deploy/setup-reaper-role.sh 直讀）、勿誤補。
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./deploy/secrets}/postgres_password.txt
  redis_password:
    file: ${SECRETS_DIR:-./deploy/secrets}/redis_password.txt
  jwt_secret:
    file: ${SECRETS_DIR:-./deploy/secrets}/jwt_secret.txt
  refresh_token_secret:
    file: ${SECRETS_DIR:-./deploy/secrets}/refresh_token_secret.txt
  database_url:
    file: ${SECRETS_DIR:-./deploy/secrets}/database_url.txt
  redis_url:
    file: ${SECRETS_DIR:-./deploy/secrets}/redis_url.txt
  captcha_secret:
    file: ${SECRETS_DIR:-./deploy/secrets}/captcha_secret.txt
  # 016-observability T009：grafana 管理密碼（GF_SECURITY_ADMIN_PASSWORD $__file{} provider 注入）
  grafana_admin_password:
    file: ${SECRETS_DIR:-./deploy/secrets}/grafana_admin_password.txt
  # 016-observability T012：告警 webhook URL（alerting/contact-points.yml $__file{} provider 注入）
  alert_webhook_url:
    file: ${SECRETS_DIR:-./deploy/secrets}/alert_webhook_url.txt
  # 016-observability T025：reaper 最小權限 DB 憑證（composite＝postgres://reaper:…；
  # m012 建 role、deploy/setup-reaper-role.sh 設密；FR-013 密碼零進版本庫）
  reaper_database_url:
    file: ${SECRETS_DIR:-./deploy/secrets}/reaper_database_url.txt
  # 020-email-verify：SMTP 密碼（dev 亂數 leaf 未消費；prod 真值＝Gmail app password、RUNBOOK §15.4 回寫）
  smtp_password:
    file: ${SECRETS_DIR:-./deploy/secrets}/smtp_password.txt
  # 020-email-verify：驗證憑據 HS256 獨立金鑰（與 jwt/refresh/captcha 隔離）
  email_verify_secret:
    file: ${SECRETS_DIR:-./deploy/secrets}/email_verify_secret.txt
