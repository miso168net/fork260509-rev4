events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json text/xml application/xml text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"service":"front-nginx",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # vite dev server HMR 走 websocket：有 Upgrade 頭 → Connection: upgrade，否則 close
    # （供 _locations.inc 的 location / 透傳升級用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 裁剪聲明（001 不帶入）：Cloudflare 權威驗證閘（geo/map）→ ip-gate 功能刀；
    # limit_req_zone 速率限制 → auth 功能刀。

    include /etc/nginx/conf.d/*.conf;
}
