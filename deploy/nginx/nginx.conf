events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json text/xml application/xml text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"service":"front-nginx",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # vite dev server HMR 走 websocket：有 Upgrade 頭 → Connection: upgrade，否則 close
    # （供 _locations.inc 的 location / 透傳升級用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cloudflare 權威驗證閘（008 ip-gate 兌現 001 裁剪聲明、FR-008）：
    # geo $cf_edge——TCP peer（$remote_addr）屬 CF 邊緣出口網段→1、否則 0（傳輸層對端、偽造不了）。
    # ★CF 邊緣網段＝部署參數（B-037）：prod 由維運按 https://www.cloudflare.com/ips/ 定期更新；
    # dev 拓樸無 CF 前置→留空集＝$cf_edge 恆 0、兩標頭恆空＝被移除。
    geo $cf_edge {
        default 0;
        # 部署參數（B-037）：CF 邊緣網段逐行列於此、值恆 1，例：
        # 173.245.48.0/20 1;
        # 2400:cb00::/32  1;
    }
    # X-CF-Verified 注入值：CF 邊緣直連→"1"、其餘→空字串（proxy_set_header 設空值＝nginx
    # 移除該標頭——非 CF 流量 client 自帶 X-CF-Verified 不倖存、FR-008）。
    map $cf_edge $cf_verified {
        1       "1";
        default "";
    }
    # CF-Connecting-IP 同理：CF 前置→透傳 CF 注入原值；非 CF→空＝移除（client 自帶偽造值不穿透）。
    map $cf_edge $cf_connecting_ip {
        1       $http_cf_connecting_ip;
        default "";
    }

    # 007 登入節流（auth 功能刀兌現原裁剪聲明「limit_req_zone 速率限制」半句）：
    # 三值（zone 名／size／rate）user 拍板 2026-07-10、沿用 rev3 實戰驗證值；
    # zone key＝$binary_remote_addr（nginx 自身觀察的 TCP peer、偽造不了，不依賴 XFF 信任模型）。
    # 008 分工補述：本層限流鍵恆用傳輸層 peer、與信任錨無涉；真實來源還原（XFF／CF 標頭）歸
    # rust-api request_context_mw——本層對後端只供權威輸入（X-CF-Verified／CF-Connecting-IP 覆寫）。
    # 429 為本刀新增（rev3 用預設 503）：基建層拒絕、body 不作信封（同 502/504 類，非 rust-api API 面）。
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
